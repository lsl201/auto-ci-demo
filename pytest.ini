[pytest]
markers =
    smoke: 冒烟测试用例
    regression: 回归测试用例
    metrics: 模型指标测试用例
    drift: 数据漂移测试用例
    mine: 自定义测试用例
    mycase: 自定义测试用例
    custom: 自定义测试
    metric:离线模型指标验收用例(准确率/误判率)
    robust_noise: 脏输入鲁棒测试
    robust_ood: 域外样本鲁棒测试
    biz_metric:业务准确率指标测试
    risk_legal:合规高风险鲁棒测试
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v