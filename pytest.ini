[pytest]
markers =
    smoke: 冒烟测试用例
    regression: 完整回归测试用例
    drift: 数据分布漂移测试用例
    robust_noise: 域外样本鲁棒测试
    robust_ood: 域外样本鲁棒测试
    biz_metric: 业务准确率、FPR等核心指标验收用例
    risk_legal: 公平性合规高风险校验
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v